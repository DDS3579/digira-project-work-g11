    <!-- ═══ TOPBAR ═══ -->

    <!-- ═══ MODAL ═══ -->
    <div class="modal-overlay" id="uni-modal">
      <div class="modal-content">

            <h2 class="modal-uni-name" id="modal-name"></h2>
            <div class="modal-uni-country">
              <span id="modal-flag"></span>

            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

        <div class="modal-body">

            <div class="modal-stat-card">

            </div>
            <div class="modal-stat-card">
              <div class="modal-stat-label">Difficulty</div>

    <!-- ═══ MAIN ═══ -->
    <main class="main-content">
      <!-- DEFAULT VIEW -->
      <div id="default-view">
        <!-- Top Universities Section -->
        <div class="uni-page-section">
          <div class="uni-section-header">
            <h2>🏆 Top Universities</h2>
          </div>
          <div class="field-tabs-wrapper">
            <div class="field-tabs" id="field-tabs"></div>
          </div>
          <div class="uni-scroll-row" id="top-unis-row"></div>
        </div>

        <!-- Recently Added Section -->
        <div class="uni-page-section">
          <div class="uni-section-header">
            <h2>🆕 Recently Added</h2>
            <button class="view-all-link" id="view-all-btn">
              View All
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>

            </button>
          </div>
          <div class="recently-added-row" id="recently-added-row"></div>
        </div>
      </div>

      <!-- VIEW ALL (hidden by default) -->
      <div id="view-all-section" style="display: none;">
        <div class="view-all-bar">
          <button class="back-btn" id="back-btn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>

            Back

            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

    <!-- ═══ SCRIPTS ═══ -->
    <script src="../../js/data.js"></script>
    <script src="../../js/demo-auth.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        /* ── Sidebar Logic (preserved) ── */
        const body = document.body;
        const toggle = document.getElementById('sidebar-toggle');
        const overlay = document.getElementById('drawer-overlay');
        const navItems = document.querySelectorAll('.nav-item');
        const pageTitle = document.getElementById('page-title');

        function initLayout() {
          const w = window.innerWidth;
          body.classList.remove('sidebar-collapsed', 'mobile-open');
          if (w >= 768 && w < 1200) body.classList.add('sidebar-collapsed');
        }
        initLayout();

        const pageMapping = {
          Home: "home.html",
          Universities: "universities.html",
          "Scholarships Available": "scholarships.html",
          "Compare Universities": "comparision.html",
          "Loan & EMI Calculator": "loan.html",
          "Local Alternatives": "alternatives.html",
          Profile: "profile.html",
          Settings: "settings.html",
        };

        navItems.forEach(item => {
          item.addEventListener('click', () => {
            const page = item.getAttribute('data-page');
            const fileName = pageMapping[page];

            if (fileName) {
              navItems.forEach(n => n.classList.remove('active'));
              item.classList.add('active');
              const label = item.querySelector('.nav-label');
              if (label) pageTitle.textContent = label.textContent.trim();
              if (window.innerWidth < 768) body.classList.remove('mobile-open');
              
              // Navigate to the page
              window.location.href = fileName;
            }
          });
        });

        toggle.addEventListener('click', () => {
          if (window.innerWidth < 768) body.classList.toggle('mobile-open');
          else body.classList.toggle('sidebar-collapsed');
        });

        overlay.addEventListener('click', () => body.classList.remove('mobile-open'));
        window.addEventListener('resize', () => {
          if (window.innerWidth >= 768) body.classList.remove('mobile-open');
        });

        /* ══════════════════════════════════════
           UNIVERSITY PAGE LOGIC
           ══════════════════════════════════════ */

        const data = UNIVERSITY_DATA;
        const fields = data.fields;

        // Country flag map
        const FLAGS = {
          'USA': '🇺🇸', 'UK': '🇬🇧', 'Canada': '🇨🇦', 'Australia': '🇦🇺',
          'Germany': '🇩🇪', 'France': '🇫🇷', 'Japan': '🇯🇵', 'China': '🇨🇳',
          'South Korea': '🇰🇷', 'Singapore': '🇸🇬', 'Netherlands': '🇳🇱',
          'Switzerland': '🇨🇭', 'Sweden': '🇸🇪', 'India': '🇮🇳',
          'Hong Kong': '🇭🇰', 'Denmark': '🇩🇰', 'Finland': '🇫🇮',
          'Norway': '🇳🇴', 'Ireland': '🇮🇪', 'New Zealand': '🇳🇿',
          'Belgium': '🇧🇪', 'Austria': '🇦🇹', 'Italy': '🇮🇹',
          'Spain': '🇪🇸', 'Brazil': '🇧🇷', 'Mexico': '🇲🇽',
          'Malaysia': '🇲🇾', 'Thailand': '🇹🇭', 'Taiwan': '🇹🇼',
          'Saudi Arabia': '🇸🇦', 'UAE': '🇦🇪', 'South Africa': '🇿🇦',
          'Russia': '🇷🇺', 'Poland': '🇵🇱', 'Czech Republic': '🇨🇿',
          'Argentina': '🇦🇷', 'Chile': '🇨🇱', 'Colombia': '🇨🇴',
          'Israel': '🇮🇱', 'Portugal': '🇵🇹', 'Greece': '🇬🇷'
        };

        function getFlag(country) {
          return FLAGS[country] || '🌍';
        }

        function getDifficultyClass(score) {
          if (score >= 8) return 'difficulty-high';
          if (score >= 5) return 'difficulty-medium';
          return 'difficulty-low';
        }

        function formatTuition(amount) {
          return '$' + amount.toLocaleString();
        }

        function getShortFieldName(name) {
          const map = {
            'Computer Science and Information Systems': 'CS & IT',
            'Business and Management Studies': 'Business',
            'Finance (Accounting and Finance)': 'Finance',
            'Economics and Econometrics': 'Economics',
            'Data Science and Artificial Intelligence': 'DS & AI',
            'Nursing': 'Nursing',
            'Medicine': 'Medicine',
            'Engineering and Technology': 'Engineering',
            'Agriculture and Forestry': 'Agriculture',
            'Environmental Sciences': 'Environment'
          };
          return map[name] || name;
        }

        // ── Build University Card HTML ──
        function createCardHTML(uni, fieldName) {
          const flag = getFlag(uni.country);
          const diffClass = getDifficultyClass(uni.admission_difficulty_score);
          const badges = uni.scholarships_and_grants.slice(0, 2)
            .map(s => `<span class="uni-badge">${s}</span>`).join('');

          return `
            <div class="uni-card" data-uni='${JSON.stringify(uni).replace(/'/g, "&#39;")}' data-field="${fieldName}">
              <div class="uni-card-header">
                <div class="uni-rank">#${uni.rank}</div>
                <div class="uni-country">
                  <span class="country-flag">${flag}</span>
                  <span>${uni.country}</span>
                </div>
              </div>
              <h3 class="uni-name">${uni.university_name}</h3>
              <span class="uni-field-tag">${getShortFieldName(fieldName)}</span>
              <div class="uni-stats">
                <div class="stat-item">
                  <span class="stat-label">Tuition/Yr</span>
                  <span class="stat-value">${formatTuition(uni.average_annual_tuition_usd)}</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                  <span class="stat-label">Acceptance</span>
                  <span class="stat-value">${uni.acceptance_rate_percent}%</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                  <span class="stat-label">Difficulty</span>
                  <span class="stat-value ${diffClass}">${uni.admission_difficulty_score}/10</span>
                </div>
              </div>
              <div class="uni-badges">${badges}</div>
              <button class="uni-details-btn">
                View Details
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                </svg>
              </button>
            </div>
          `;
        }

        // ── TOP UNIVERSITIES: Tabs + Row ──
        const tabsContainer = document.getElementById('field-tabs');
        const topRow = document.getElementById('top-unis-row');
        let activeFieldIndex = 0;

        // Create tabs
        fields.forEach((field, i) => {
          const tab = document.createElement('button');
          tab.className = 'field-tab' + (i === 0 ? ' active' : '');
          tab.textContent = getShortFieldName(field.field_name);
          tab.addEventListener('click', () => {
            document.querySelectorAll('.field-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            activeFieldIndex = i;
            renderTopUnis();
          });
          tabsContainer.appendChild(tab);
        });

        function renderTopUnis() {
          const field = fields[activeFieldIndex];
          const top5 = field.universities
            .sort((a, b) => a.rank - b.rank)
            .slice(0, 5);
          topRow.innerHTML = top5.map(u => createCardHTML(u, field.field_name)).join('');
          attachCardListeners(topRow);
        }
        renderTopUnis();

        // ── RECENTLY ADDED ──
        const recentRow = document.getElementById('recently-added-row');

        function renderRecentlyAdded() {
          // Grab last 2 universities from each field (simulate recently added)
          let recent = [];
          fields.forEach(field => {
            const unis = field.universities;
            const lastOnes = unis.slice(-2);
            lastOnes.forEach(u => {
              recent.push({ uni: u, fieldName: field.field_name });
            });
          });
          // Show max 8
          recent = recent.slice(0, 8);
          recentRow.innerHTML = recent.map(r => createCardHTML(r.uni, r.fieldName)).join('');
          attachCardListeners(recentRow);
        }
        renderRecentlyAdded();

        // ── VIEW ALL ──
        const defaultView = document.getElementById('default-view');
        const viewAllSection = document.getElementById('view-all-section');
        const viewAllContent = document.getElementById('view-all-content');
        const viewAllBtn = document.getElementById('view-all-btn');
        const backBtn = document.getElementById('back-btn');
        const searchInput = document.getElementById('search-input');
        const totalCount = document.getElementById('total-count');

        viewAllBtn.addEventListener('click', () => {
          defaultView.style.display = 'none';
          viewAllSection.style.display = 'block';
          renderViewAll();
        });

        backBtn.addEventListener('click', () => {
          viewAllSection.style.display = 'none';
          defaultView.style.display = 'block';
          searchInput.value = '';
        });

        function renderViewAll(query = '') {
          const q = query.toLowerCase().trim();
          let totalUnis = 0;
          let html = '';

          fields.forEach(field => {
            let unis = [...field.universities].sort((a, b) => a.rank - b.rank);

            if (q) {
              unis = unis.filter(u =>
                u.university_name.toLowerCase().includes(q) ||
                u.country.toLowerCase().includes(q) ||
                field.field_name.toLowerCase().includes(q)
              );
            }

            if (unis.length === 0) return;

            totalUnis += unis.length;

            html += `
              <div class="field-group">
                <div class="field-group-title">
                  ${field.field_name}
                  <span class="field-group-count">${unis.length} universities</span>
                </div>
                <div class="uni-grid">
                  ${unis.map(u => createCardHTML(u, field.field_name)).join('')}
                </div>
              </div>
            `;
          });

          viewAllContent.innerHTML = html || '<p style="color:#64748b;text-align:center;padding:40px;">No universities found.</p>';
          totalCount.innerHTML = `Total: <span>${totalUnis}</span> universities`;
          attachCardListeners(viewAllContent);
        }

        // Search
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(() => {
            renderViewAll(e.target.value);
          }, 250);
        });

        // ── MODAL ──
        const modal = document.getElementById('uni-modal');
        const modalClose = document.getElementById('modal-close');

        function openModal(uni, fieldName) {
          document.getElementById('modal-rank').textContent = `Rank #${uni.rank}`;
          document.getElementById('modal-name').textContent = uni.university_name;
          document.getElementById('modal-flag').textContent = getFlag(uni.country);
          document.getElementById('modal-country').textContent = uni.country;
          document.getElementById('modal-field').textContent = fieldName;
          document.getElementById('modal-tuition').textContent = formatTuition(uni.average_annual_tuition_usd);
          document.getElementById('modal-acceptance').textContent = uni.acceptance_rate_percent + '%';

          const diffEl = document.getElementById('modal-difficulty');
          diffEl.textContent = uni.admission_difficulty_score + '/10';
          diffEl.className = 'modal-stat-value ' + getDifficultyClass(uni.admission_difficulty_score);

          document.getElementById('modal-scholarships').innerHTML =
            uni.scholarships_and_grants.map(s => `<li>${s}</li>`).join('');

          document.getElementById('modal-financial').innerHTML =
            uni.financial_burden_reduction_policies.map(s => `<li>${s}</li>`).join('');

          document.getElementById('modal-accommodation').innerHTML =
            uni.accommodation_and_facilities.map(s => `<li>${s}</li>`).join('');

          document.getElementById('modal-source').textContent = '📊 ' + uni.ranking_source;

          modal.classList.add('active');
          document.body.style.overflow = 'hidden';
        }

        function closeModal() {
          modal.classList.remove('active');
          document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
          if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeModal();
        });

        // ── Attach click listeners to cards ──
        function attachCardListeners(container) {
          container.querySelectorAll('.uni-card').forEach(card => {
            card.addEventListener('click', () => {
              const uni = JSON.parse(card.dataset.uni);
              const fieldName = card.dataset.field;
              openModal(uni, fieldName);
            });
          });
        }
      });
    </script>
  </body>
</html>
