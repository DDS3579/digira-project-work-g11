<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sahaj Shikshya</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Navbar for Sahaj Shikshya begins -->
    <header
      class="flex items-center justify-between px-6 py-3 md:py-4 shadow max-w-5xl rounded-full mx-auto w-full bg-white mt-4"
    >
      <a href="#home">
        <img
          src="https://raw.githubusercontent.com/prebuiltui/prebuiltui/main/assets/dummyLogo/prebuiltuiDummyLogo.svg"
        />
      </a>
      <nav
        id="menu"
        class="max-md:absolute max-md:top-0 max-md:left-0 max-md:overflow-hidden items-center justify-center max-md:h-full max-md:w-0 transition-[width] bg-white/50 backdrop-blur flex-col md:flex-row flex gap-8 text-gray-900 text-sm font-normal"
      >
        <a class="hover:text-indigo-600" href="#home"> Home </a>
        <a class="hover:text-indigo-600" href="#features"> Features </a>
        <a class="hover:text-indigo-600" href="#about"> About Us </a>
        <a class="hover:text-indigo-600" href="#contact"> Contact Us </a>
        <button id="closeMenu" class="md:hidden text-gray-600">
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </nav>
      <div class="flex items-center space-x-4">
        <button
          class="size-8 flex items-center justify-center hover:bg-gray-100 transition border border-slate-300 rounded-md"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 15 15"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M7.5 10.39a2.889 2.889 0 1 0 0-5.779 2.889 2.889 0 0 0 0 5.778M7.5 1v.722m0 11.556V14M1 7.5h.722m11.556 0h.723m-1.904-4.596-.511.51m-8.172 8.171-.51.511m-.001-9.192.51.51m8.173 8.171.51.511"
              stroke="#353535"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <a
          class="hidden md:flex bg-indigo-600 text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-indigo-700 transition"
          href="#"
        >
          Dashboard
        </a>
        <button id="openMenu" class="md:hidden text-gray-600">
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </header>
    <!-- Navbar for Sahaj Shikshya ends -->

    <!-- Hero Section Starts -->

    <!-- Hero Section End -->

    <!-- Trusted By Section starts -->
    <div
      id="numbers"
      class="border-blue-500 block max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 lg:py-20"
    >
      <div
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8 text-center"
      >
        <div>
          <h2 class="text-3xl font-bold text-gray-900">100+</h2>
          <p class="text-gray-600 mt-2">Consultants</p>
        </div>
        <div>
          <h2 class="text-3xl font-bold text-gray-900">500+</h2>
          <p class="text-gray-600 mt-2">Students</p>
        </div>
        <div>
          <h2 class="text-3xl font-bold text-gray-900">50+</h2>
          <p class="text-gray-600 mt-2">Universities</p>
        </div>
        <div>
          <h2 class="text-3xl font-bold text-gray-900">10+</h2>
          <p class="text-gray-600 mt-2">Countries</p>
        </div>
      </div>
    </div>

    <!-- Trusted By Section ends -->

    <!-- Features Section starts -->

    <!-- Features Section ends -->

    <!-- Testimonials Section starts -->

    <!-- Testimonials Section ends -->

    <!-- About Us Section starts -->
    <!-- About Us Section ends -->

    <!-- Contact Us Section starts -->
    <!-- Contact Us Section ends -->

    <!-- Footer Starts -->
    <!-- Footer Ends -->
    <script src="js/ui.js"></script>
  </body>
</html>
